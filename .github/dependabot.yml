version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Wait 7 days after a new version is published before proposing it.
    # Security fixes are not delayed by this.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Wait 7 days after a new version is published before proposing it.
    # Security fixes are not delayed by this.
    cooldown:
      default-days: 7
    # Bundle all workflow step updates into one pull request per month.
    groups:
      github-actions:
        patterns:
          - "*"
